name: Update OpenAPI specifications

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev-compat libmariadb-dev

      - name: Install Frappe Bench
        run: pip install frappe-bench

      - name: Init Bench
        run: bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python python3 frappe-bench

      - name: Get Apps
        working-directory: frappe-bench
        run: |
          bench get-app --branch version-15 --skip-assets erpnext
          bench get-app --branch main --skip-assets crm
          bench get-app --branch develop --skip-assets https://github.com/alyf-de/frappe_openapi.git
          bench get-app frappe_field_sales "$GITHUB_WORKSPACE"

      - name: Configure Redis
        working-directory: frappe-bench
        run: |
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379

      - name: Create Site
        working-directory: frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin --no-mariadb-socket openapi-site
          bench --site openapi-site install-app erpnext
          bench --site openapi-site install-app crm
          bench --site openapi-site install-app frappe_field_sales
          bench --site openapi-site install-app frappe_openapi

      - name: Generate OpenAPI Bundles
        working-directory: frappe-bench
        run: |
          bench --site openapi-site generate-openapi \
            --app frappe_field_sales \
            --app erpnext \
            --app crm \
            --output "$RUNNER_TEMP/generated-openapi"

          python "$GITHUB_WORKSPACE/.github/scripts/merge_openapi_specs.py" \
            "$RUNNER_TEMP/generated-openapi" \
            "$GITHUB_WORKSPACE/openapi"

      - name: Commit Updated Specifications
        run: |
          git add openapi/frappe_field_sales.json openapi/frappe_field_sales_full.json
          if git diff --cached --quiet; then
            echo "OpenAPI specifications are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update generated OpenAPI specifications [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
